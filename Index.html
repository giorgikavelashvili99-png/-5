<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>MOON AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #131316;
    --surface2: #1a1a1f;
    --line: #232328;
    --line2: #34343c;
    --text: #ececf0;
    --body: #dcdce2;
    --muted: #8b8b96;
    --accent: #a9bbff;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg) radial-gradient(70% 38% at 50% 0%, rgba(169,187,255,.065), rgba(169,187,255,0)) no-repeat;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Georgian", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  svg { display: block; }

  /* ზედა ზოლი */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; padding-top: calc(14px + env(safe-area-inset-top));
    border-bottom: 1px solid transparent; transition: border-color .25s;
  }
  header.scrolled { border-bottom-color: var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; padding: 6px 4px; border-radius: 10px; transition: opacity .18s, transform .18s var(--ease); }
  button.brand:hover { opacity: .8; }
  button.brand:active { transform: scale(.96); }
  .brand svg { width: 22px; height: 22px; color: var(--text); }
  .brand b { font-size: 14px; font-weight: 600; letter-spacing: .32em; text-indent: .04em; }
  .icon {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--muted);
    transition: color .18s, background .18s;
  }
  .icon:hover { color: var(--text); background: var(--surface2); }
  .icon:active { transform: scale(.94); }

  /* საუბარი */
  #chat { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 18px 20px 12px; }
  .wrap { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; min-height: 100%; }

  /* მარცხენა პანელი: ბოლო საუბრები */
  .hl { display: flex; align-items: center; gap: 10px; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 20; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 86vw); z-index: 21;
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
    transform: translate3d(-102%, 0, 0); visibility: hidden;
    transition: transform .32s var(--ease), visibility 0s .32s;
  }
  .drawer.open { transform: none; visibility: visible; transition: transform .32s var(--ease), visibility 0s; }
  .drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 6px 22px; }
  .drawer-h .brand svg { width: 22px; height: 22px; }
  .drawer-label { padding: 22px 24px 8px; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .recents { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 10px 110px; }
  .rec { display: flex; align-items: center; border-radius: 14px; transition: background .18s; }
  .rec:hover, .rec.active { background: var(--surface2); }
  .rec .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 13px 8px 13px 14px; text-align: left; color: var(--body); font-size: 15.5px; }
  .rec .open svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .rec .open span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .del { width: 34px; height: 34px; margin-right: 6px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); opacity: 0; transition: opacity .18s, color .18s; flex: none; }
  .rec .del svg { width: 16px; height: 16px; }
  .rec:hover .del, .rec:focus-within .del { opacity: 1; }
  .rec .del:hover { color: #ff8f9f; }
  @media (hover: none) { .rec .del { opacity: .6; } }
  .rec-empty { padding: 14px; font-size: 14px; color: var(--muted); line-height: 1.6; }
  .newchat {
    position: absolute; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); height: 54px; padding: 0 24px 0 20px;
    border-radius: 999px; background: var(--text); color: #0b0b0d; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500;
    box-shadow: 0 8px 28px rgba(0,0,0,.45); transition: transform .18s var(--ease);
  }
  .newchat svg { width: 20px; height: 20px; }
  .newchat:active { transform: scale(.96); }

  .msg { animation: fade .3s var(--ease) both; }
  .msg.instant { animation: none; }
  @keyframes fade { from { opacity: 0; transform: translate3d(0, 8px, 0); } to { opacity: 1; transform: none; } }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: min(560px, 86%); background: var(--surface2); border: 1px solid var(--line);
    border-radius: 20px 20px 6px 20px; padding: 11px 17px; white-space: pre-wrap; line-height: 1.6; font-size: 15.5px;
    overflow-wrap: anywhere;
  }
  .msg.bot .bubble { color: var(--body); line-height: 1.8; font-size: 16px; overflow-wrap: anywhere; }
  .bubble > :first-child { margin-top: 0; }
  .bubble p { margin: 0 0 12px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h2, .bubble h3, .bubble h4 { color: var(--text); margin: 20px 0 8px; line-height: 1.3; font-weight: 600; }
  .bubble h2 { font-size: 21px; } .bubble h3 { font-size: 18.5px; } .bubble h4 { font-size: 16.5px; }
  .bubble ul, .bubble ol { margin: 4px 0 14px; padding-left: 22px; }
  .bubble li { margin: 4px 0; padding-left: 2px; }
  .bubble li::marker { color: var(--muted); }
  .bubble strong { color: var(--text); font-weight: 650; }
  .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(169,187,255,.35); }
  .bubble :not(pre) > code {
    background: var(--surface2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px;
    font-size: 13.5px; font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text);
  }
  .file { margin: 14px 0; border: 1px solid var(--line); border-radius: 16px; background: #0e0e11; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 12px 14px; align-items: center; }
  .file-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--text); }
  .file-ic svg { width: 22px; height: 22px; }
  .file-meta { min-width: 0; }
  .file-meta b { display: block; font-size: 15px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .file-act { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .file-act button { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); font-size: 13.5px; color: var(--body); transition: background .18s, color .18s, transform .15s var(--ease); }
  .file-act button:hover { background: var(--surface2); color: var(--text); }
  .file-act button:active { transform: scale(.96); }
  .file-act button.primary { background: var(--text); color: #0b0b0d; border-color: var(--text); font-weight: 600; }
  .file-act button.primary:hover { background: #fff; }
  .file pre { grid-column: 1 / -1; margin: 0; padding: 12px 14px; max-height: 360px; overflow: auto; border-top: 1px solid var(--line); direction: ltr; text-align: left; font-size: 13px; line-height: 1.6; }
  .file pre[hidden] { display: none; }
  .file pre code { font-family: ui-monospace, Menlo, Consolas, monospace; color: #e6e6ea; }
  .file.busy .file-meta b span {
    color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(100deg, #6f6f7a 30%, #ececf0 50%, #6f6f7a 70%); background-size: 250% 100%; animation: shimmer 2.4s linear infinite;
  }
  .bubble li.sub { list-style-type: circle; margin-left: 20px; counter-increment: list-item 0; }
  .bubble blockquote { margin: 14px 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--line2); color: var(--muted); }
  .bubble blockquote p { margin: 0 0 6px; }
  .bubble hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
  .tbl { margin: 14px 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  .tbl table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.55; }
  .tbl th, .tbl td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl th { color: var(--text); font-weight: 600; background: var(--surface); white-space: nowrap; }
  .tbl tr:last-child td { border-bottom: 0; }
  .think { margin: 0 0 14px; }
  .think-h { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 4px 0; color: var(--muted); font-size: 15px; line-height: 1.5; text-align: left; transition: color .18s; }
  .think-h:hover { color: var(--body); }
  .think-h .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .think-h svg { width: 14px; height: 14px; flex: none; transition: transform .22s var(--ease); }
  .think.open .think-h svg { transform: rotate(180deg); }
  .think.live .think-h .txt {
    color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(100deg, #6f6f7a 30%, #ececf0 50%, #6f6f7a 70%); background-size: 250% 100%; animation: shimmer 2.4s linear infinite;
  }
  .think.live .think-h .txt.swap { animation: shimmer 2.4s linear infinite, sIn .5s var(--ease) both; }
  .steps { display: none; list-style: none; margin: 10px 0 0 4px; padding: 0; }
  .think.open .steps { display: block; }
  .steps li { position: relative; padding: 0 0 14px 24px; color: var(--muted); font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .steps li::before { content: ""; position: absolute; left: 0; top: .5em; width: 9px; height: 9px; border-radius: 50%; background: var(--line2); }
  .steps li::after { content: ""; position: absolute; left: 4px; top: calc(.5em + 13px); bottom: 3px; width: 1px; background: var(--line); }
  .steps li:last-child { padding-bottom: 2px; }
  .steps li:last-child::after { display: none; }
  .status { padding: 6px 0; font-size: 15.5px; line-height: 1.6; }
  .status span {
    display: inline-block; color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(100deg, #6f6f7a 30%, #ececf0 50%, #6f6f7a 70%); background-size: 250% 100%;
    animation: shimmer 2.4s linear infinite;
  }
  .status span.swap { animation: shimmer 2.4s linear infinite, sIn .5s var(--ease) both; }
  @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -150% 0; } }
  @keyframes sIn { from { opacity: 0; transform: translate3d(0, 4px, 0); } to { opacity: 1; transform: none; } }
  .code { margin: 14px 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #0e0e11; }
  .code-h {
    display: flex; justify-content: space-between; align-items: center; padding: 8px 14px;
    border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); direction: ltr; letter-spacing: .04em;
  }
  .code-h button { color: var(--muted); font-size: 12px; padding: 2px 4px; transition: color .18s; }
  .code-h button:hover { color: var(--text); }
  .code pre { padding: 14px 16px; overflow-x: auto; direction: ltr; text-align: left; font-size: 13.5px; line-height: 1.65; }
  .code code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.65; color: #e6e6ea; }


  /* სიტყვები რბილად ამოდის: მხოლოდ opacity, ამიტომ ლაგის გარეშეა და ტექსტი არ ცახცახებს */
  .w, .blk { animation: wIn 1.2s cubic-bezier(.3, .6, .3, 1) both; }
  @keyframes wIn { from { opacity: 0; } to { opacity: 1; } }

  .ptr {
    position: fixed; left: 50%; top: calc(58px + env(safe-area-inset-top)); z-index: 6; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; background: var(--surface2); border: 1px solid var(--line2); color: var(--text);
    opacity: 0; pointer-events: none; transform: translate3d(-50%, -50px, 0);
  }
  .ptr svg { width: 18px; height: 18px; transition: transform .15s; }
  .ptr.go svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .jump {
    position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 5;
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface2); border: 1px solid var(--line2); color: var(--text);
    opacity: 0; pointer-events: none; transform: translate3d(-50%, 8px, 0);
    transition: opacity .22s, transform .25s var(--ease);
  }
  .jump.show { opacity: 1; pointer-events: auto; transform: translate3d(-50%, 0, 0); }
  .jump:hover { border-color: var(--a1, var(--accent)); }

  .sources { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; animation: fade .45s var(--ease) both; }
  .sources span { font-size: 12px; color: var(--muted); letter-spacing: .1em; margin-right: 2px; }
  .sources a {
    font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
    text-decoration: none; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .18s, border-color .18s;
  }
  .sources a:hover { color: var(--text); border-color: var(--line2); }
  .thinking { display: inline-flex; gap: 6px; padding: 10px 0; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: breathe 1.2s ease-in-out infinite; }
  .thinking i:nth-child(2) { animation-delay: .18s; } .thinking i:nth-child(3) { animation-delay: .36s; }
  @keyframes breathe { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  .actions { display: flex; gap: 4px; margin-top: 10px; opacity: 0; transition: opacity .2s; }
  .msg.bot:hover .actions, .msg.bot:focus-within .actions { opacity: 1; }
  @media (hover: none) { .actions { opacity: 1; } }
  .act { height: 30px; padding: 0 9px; border-radius: 9px; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; transition: color .18s, background .18s; }
  .act:hover { color: var(--text); background: var(--surface2); }
  .act svg { width: 15px; height: 15px; }
  .err { color: #ff8f9f; }

  /* შეყვანა */
  footer { padding: 8px 20px calc(14px + env(safe-area-inset-bottom)); }
  .composer {
    max-width: 740px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 8px;
    transition: border-color .2s;
  }
  .composer:focus-within { border-color: var(--line2); }
  textarea {
    flex: 1; resize: none; max-height: 190px; min-height: 28px; background: none; border: 0; outline: 0;
    color: var(--text); font: inherit; font-size: 16px; line-height: 1.55; padding: 8px 4px; caret-color: var(--accent);
  }
  textarea::placeholder { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; transition: color .18s, background .18s, transform .18s var(--ease); }
  .tool svg { width: 21px; height: 21px; }
  .tool:hover { color: var(--text); background: var(--surface2); }
  .tool:active { transform: scale(.92); }
  .tool[aria-pressed="true"] { color: var(--accent); background: var(--surface2); }
  .imgcard { margin: 0; max-width: 520px; }
  .imgcard img { display: block; width: 100%; height: auto; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); animation: fade .7s var(--ease) both; }
  .imgcard figcaption { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .imgcard .cap { flex: 1 1 100%; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imgcard .file-act { grid-column: auto; }
  .composer { flex-wrap: wrap; }
  .composer textarea { flex: 1 1 0; min-width: 0; }
  .attach { display: none; flex: 1 1 100%; gap: 8px; padding: 4px 4px 6px; overflow-x: auto; }
  .attach.has { display: flex; }
  .att { position: relative; flex: none; width: 66px; height: 66px; }
  .att img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 1px solid var(--line2); display: block; }
  .att button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: #0b0b0d; display: grid; place-items: center; }
  .att button svg { width: 12px; height: 12px; }
  .uimgs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .uimgs img { height: 110px; max-width: 100%; border-radius: 12px; object-fit: cover; display: block; }
  .ctx { position: fixed; z-index: 40; min-width: 210px; background: #26262b; border: 1px solid var(--line2); border-radius: 18px; padding: 6px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6); opacity: 0; transform: scale(.96); transform-origin: top left; pointer-events: none; visibility: hidden;
    transition: opacity .15s, transform .18s var(--ease), visibility 0s .18s; }
  .ctx.open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .15s, transform .18s var(--ease), visibility 0s; }
  .ctx button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 14px; border-radius: 12px; font-size: 16px; color: var(--text); text-align: left; }
  .ctx button:hover, .ctx button:active { background: #303036; }
  .ctx svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
  .toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); z-index: 50; transform: translate3d(-50%, 8px, 0); background: var(--text); color: #0b0b0d;
    padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease); }
  .toast.show { opacity: 1; transform: translate3d(-50%, 0, 0); }
  @media (hover: none) {
    .msg .bubble { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .msg .bubble.sel { -webkit-user-select: text; user-select: text; }
    .msg .code pre, .msg .file pre { -webkit-user-select: text; user-select: text; }
  }
  .imgmiss { color: var(--muted); font-size: 14px; }
  .imgwait { aspect-ratio: 1 / 1; max-width: 520px; border-radius: 16px; border: 1px solid var(--line);
    background: linear-gradient(100deg, var(--surface) 30%, var(--surface2) 50%, var(--surface) 70%); background-size: 250% 100%; animation: shimmer 2.4s linear infinite; }
  #send {
    width: 40px; height: 40px; border-radius: 50%; background: var(--text); color: #0b0b0d; display: grid; place-items: center; flex: none;
    transition: transform .18s var(--ease), opacity .2s, background .2s;
  }
  #send:hover:not(:disabled) { transform: scale(1.06); }
  #send:active:not(:disabled) { transform: scale(.92); }
  #send:disabled { background: var(--surface2); color: var(--muted); cursor: default; }
  button.ver { cursor: pointer; background: none; font-family: inherit; gap: 8px; transition: color .18s, border-color .18s; }
  button.ver:hover, button.ver[aria-expanded="true"] { color: var(--text); border-color: var(--line2); }
  button.ver svg { width: 13px; height: 13px; transition: transform .2s var(--ease); }
  button.ver[aria-expanded="true"] svg { transform: rotate(180deg); }
  .vmenu { position: fixed; z-index: 45; width: min(300px, calc(100vw - 24px)); max-height: min(70vh, 520px); overflow-y: auto; background: #26262b; border: 1px solid var(--line2); border-radius: 18px; padding: 6px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events: none; visibility: hidden; transition: opacity .15s, transform .18s var(--ease), visibility 0s .18s; }
  .vmenu.open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .15s, transform .18s var(--ease), visibility 0s; }
  .vmenu button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 11px 14px; border-radius: 12px; text-align: left; color: var(--text); }
  .vmenu button:hover, .vmenu button:active { background: #303036; }
  .vmenu b { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: .06em; }
  .vmenu small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); letter-spacing: 0; }
  .vmenu .tick { width: 18px; height: 18px; color: var(--accent); flex: none; opacity: 0; }
  .vmenu button.on .tick { opacity: 1; }
  .vmenu .vgrp { padding: 10px 14px 4px; font-size: 12.5px; letter-spacing: .02em; color: var(--muted); }

      "შენ შეგიძლია სურათების დახატვაც: ამისთვის მომხმარებელმა უნდა დააჭიროს ველის მარცხენა მხარეს სურათის ღილაკს ან დაწეროს „დამიხატე ...“. არასოდეს თქვა, რომ სურათის გენერირება შეუძლებელია; უბრალოდ აუხსენი ეს ორი გზა.",
      "თუ მსჯელობისას მოკლე შეჯამებებს წერ, ისინი ქართულად დაწერე.",
      "ფორმატი: Markdown (აბზაცები, სიები, **მუქი**, ცხრილები, კოდის ბლოკები). არ გამოიყენო LaTeX და $ ფორმულები. ისრებისთვის გამოიყენე → სიმბოლო."
    ].join("\n");
  }

  // Puter-ის შეცდომა სხვადასხვა ფორმით შეიძლება მოვიდეს; ვაქცევთ გასაგებ ქართულ ტექსტად
  function puterError(err) {
    const e = err && err.error && typeof err.error === "object" ? err.error : err;
    const code = String((e && (e.code || e.error)) || "").toLowerCase();
    const status = (e && (e.status || e.statusCode)) || 0;
    const raw = String((e && e.message) || (typeof err === "string" ? err : "") || "");
    const ec = String((e && e.errorCode) || "").toLowerCase();
    if (ec === "moderation_flagged" || /moderation|safety|content.?policy/i.test(raw)) {
      return "სურათის სერვისმა ეს აღწერა დაბლოკა. ასეთი ფილტრი ხშირად რეაგირებს რეალური, ცნობილი ადამიანების სახელებზე (სპორტსმენები, პოლიტიკოსები, არტისტები). სცადე უსახელო ან გამოგონილი პერსონაჟები.";
    }
    if (code === "all_busy") return "ახლა ყველა სერვისი დატვირთულია. სცადე რამდენიმე წუთში.";
    if (code === "upstream_failed") return "სურათის დახატვა ვერ მოხერხდა. სცადე თავიდან.";
    if (code === "insufficient_funds" || status === 402) return "გამოყენების ლიმიტი ამოიწურა. ის თვეში ერთხელ ახლდება.";
    if (code === "subscription_required") return "ეს ფუნქცია ახლა მიუწვდომელია. სცადე მოგვიანებით.";
    if (code === "too_many_requests" || status === 429) return "ძალიან ბევრი მოთხოვნა ერთდროულად. რამდენიმე წამში სცადე თავიდან.";
    if (code === "auth_window_closed") return "გასაგრძელებლად ანგარიშით შესვლაა საჭირო. გაგზავნე თავიდან და დაასრულე შესვლა.";
    if (code === "popup_blocked") return "ბრაუზერმა შესვლის ფანჯარა დაბლოკა. ნება დართე pop-up-ებს ამ საიტზე და გაგზავნე თავიდან.";
    if (code === "unsupported_origin" || code === "not_available_in_app") return "ეს გვერდი ამ მისამართზე ვერ მუშაობს. გახსენი ის http/https მისამართიდან და არა ფაილის სახით.";
    if (code === "request_timeout") return "პასუხმა დიდხანს დაიგვიანა. სცადე თავიდან.";
    if (code === "input_too_large") return "შეტყობინება ძალიან დიდია. დაამოკლე და სცადე თავიდან.";
    // ტექნიკურ ტექსტს (მომწოდებლის სახელი, მოთხოვნის ნომერი) მომხმარებელს არ ვაჩვენებთ; ბრაუზერის კონსოლში ჩაიწერება
    try { console.error("MOON AI error:", err); } catch (er) {}
    return "რაღაც არასწორად წავიდა. სცადე თავიდან.";
  }
  // ლიმიტი / ანგარიშით შესვლის პრობლემა: ასეთ დროს სარეზერვო გზაზე გადავდივართ
  const isLimitError = err => {
    const e = err && err.error && typeof err.error === "object" ? err.error : err;
    const code = String((e && (e.code || e.error)) || "").toLowerCase();
    const status = (e && (e.status || e.statusCode)) || 0;
    return code === "insufficient_funds" || code === "subscription_required" || code === "too_many_requests" ||
      code === "auth_window_closed" || code === "popup_blocked" || status === 402 || status === 429;
  };
  const isModelProblem = err => {
    const e = err && err.error && typeof err.error === "object" ? err.error : err;
    const code = String((e && (e.code || e.error)) || "").toLowerCase();
    const msg = String((e && e.message) || "").toLowerCase();
    return /model/.test(code) || /(unknown|invalid|no such|unsupported|unrecognized) model|model[^.]{0,40}(not found|not exist|unknown|invalid|unavailable|not available|unsupported|not supported|deprecated)/.test(msg);
  };
  const isSearchProblem = err => {
    const t = (String((err && (err.message || (err.error && err.error.message))) || "") + " " + String((err && err.code) || "")).toLowerCase();
    return /tool|web_search|search|unsupported|not support|invalid_request|bad_request|400/.test(t);
  };

  // გამოძახებამდე ვამოწმებთ ლიმიტს, რომ სერვისის საკუთარი ფანჯარა არ გამოვიდეს
  // მოთხოვნა მაქსიმალურ ხარჯს წინასწარ "იჭერს", ამიტომ ნულამდე არ ვუცდით: მცირე მარაგიც საკმარისი არ არის
  // (1 ცენტი = 1 000 000 მიკროცენტი). ტექსტს ~10 ცენტი სჭირდება, სურათს ~30.
  async function outOfBalance(need) {
    try {
      if (!puter.auth || !puter.auth.getMonthlyUsage || !puter.auth.isSignedIn()) return false;
      const u = await puter.auth.getMonthlyUsage();
      const r = u && u.allowanceInfo && u.allowanceInfo.remaining;
      return typeof r === "number" && isFinite(r) && r < (need || 10000000);
    } catch (e) { return false; }
  }

  // სერვისის ჩაშენებული "Low Balance" ფანჯრის დამალვა (საუკეთესო მცდელობა)
  const isUpsell = t => { t = (t || "").toLowerCase(); return (t.includes("low balance") || t.includes("upgrade now") || (t.includes("upgrade") && (t.includes("funding") || t.includes("balance")))); };
  const hideUpsell = n => {
    if (!n || n.nodeType !== 1 || n.closest("#drawer, #ctx, #toast, .composer")) return;
    let host = n;
    while (host.parentElement && host.parentElement !== document.body && host.parentElement !== document.documentElement) host = host.parentElement;
    if (host === document.body || host === document.documentElement || host.id === "chat") return;
    host.style.setProperty("display", "none", "important");
  };
  new MutationObserver(list => {
    for (const m of list) for (const n of m.addedNodes) {
      if (n.nodeType !== 1 || (n.closest && n.closest("#chat, #drawer, #ctx, #toast, .composer, header"))) continue;
      const own = (n.textContent || "") + " " + (n.shadowRoot ? n.shadowRoot.textContent || "" : "");
      if (isUpsell(own)) hideUpsell(n);
    }
  }).observe(document.documentElement, { childList: true, subtree: true });

  async function send() {
    if (busy) return;
    const photos = attached.slice();
    let text = inputEl.value.trim();
    if (!text && !photos.length) return;
    if (!text) text = "გააუმჯობესე ეს ფოტო";

    const imageMode = photos.length > 0 || imgOn || IMG_RE.test(text);
    setImgMode(false);
    attached = []; renderAttach();
    if (!messages.length) wrap.innerHTML = "";
    const thumbs = photos.map(p => p.thumb);
    messages.push(thumbs.length ? { role: "user", content: text, imgs: thumbs } : { role: "user", content: text });
    addUser(text, false, messages.length - 1, thumbs);
    inputEl.value = ""; inputEl.style.height = "auto";

    const bot = addBot("");
    let answer = "", userStopped = false;
    bot._bubble.innerHTML = '<div class="think live"><button class="think-h" type="button" aria-expanded="false"><span class="txt"></span>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><ol class="steps"></ol></div><div class="ans"></div>';
    const thinkEl = bot._bubble.querySelector(".think");
    const thinkTxt = thinkEl.querySelector(".txt");
    const stepsEl = thinkEl.querySelector(".steps");
    const ansEl = bot._bubble.querySelector(".ans");
    thinkEl.querySelector(".think-h").addEventListener("click", e => {
      const open = !thinkEl.classList.contains("open");
      thinkEl.classList.toggle("open", open);
      e.currentTarget.setAttribute("aria-expanded", open ? "true" : "false");
    });

    // ფიქრის ნაბიჯები: ზედა ხაზზე მიმდინარე ნაბიჯი ჩანს, დაჭერისას ყველა ნაბიჯის სია იხსნება
    const steps = [];
    const setHead = t => {
      if (thinkTxt.textContent === t) return;
      thinkTxt.classList.remove("swap"); void thinkTxt.offsetWidth;
      thinkTxt.textContent = t; thinkTxt.classList.add("swap");
    };
    const step = t => {
      t = String(t || "").replace(/\s+/g, " ").trim().slice(0, 120);
      if (!t || answer) return;
      if (steps[steps.length - 1] !== t) {
        steps.push(t);
        if (steps.length > 14) steps.shift();
        stepsEl.innerHTML = "";
        steps.forEach(x => { const li = document.createElement("li"); li.textContent = x; stepsEl.appendChild(li); });
      }
      setHead(t);
    };
    // მოდელის მსჯელობის ტექსტიდან ვიღებთ აბზაცებს: ყოველი დასრულებული აბზაცი ცალკე ნაბიჯია
    let rbuf = "", rDone = 0;
    // ნაბიჯის დასახელება: მუქი სათაური, ან პირველი სრული წინადადება (დაუსრულებელს არ ვაჩვენებთ, რომ ტექსტი არ ციმციმებდეს)
    const labelOf = (p, final) => {
      p = String(p).trim();
      let t;
      const h = p.match(/^\*\*(.+?)\*\*/);
      if (h) t = h[1];
      else {
        const first = p.split(/\n/)[0];
        const sm = first.match(/^(.+?[.!?])(\s|$)/);
        t = sm ? sm[1] : (final ? first : "");
      }
      t = t.replace(/[*`#_]/g, "").replace(/\s+/g, " ").trim();
      return t.length >= 6 ? t : "";
    };
    // სათაურს (**...**) მოყოლილი ახსნის აბზაცი ცალკე ნაბიჯად არ ითვლება
    let afterHead = false;
    const consume = par => {
      const t = par.trim();
      if (afterHead && !/^\*\*/.test(t)) { afterHead = false; return; }
      afterHead = /^\*\*[^*]+\*\*$/.test(t);
      const l = labelOf(par, true);
      if (l) step(l);
    };
    const onReasoning = txt => {
      if (typeof txt !== "string" || !txt) return;
      rbuf += txt;
      const paras = rbuf.split(/\n\s*\n/).filter(x => x.trim());
      while (rDone < paras.length - 1) { consume(paras[rDone]); rDone++; }
      const last = paras.length ? paras[paras.length - 1] : "";
      const body = afterHead && !/^\*\*/.test(last.trim());
      const cur = last && !body ? labelOf(last) : "";
      if (cur && !answer) setHead(cur);
    };
    const flushReasoning = () => {
      const paras = rbuf.split(/\n\s*\n/).filter(x => x.trim());
      while (rDone < paras.length) { consume(paras[rDone]); rDone++; }
    };
    const finishThink = () => {
      flushReasoning();
      thinkEl.classList.remove("live");
      if (steps.length > 1) thinkTxt.textContent = "ფიქრი · " + steps.length + " ნაბიჯი";
      else thinkEl.remove();
    };
    step("კითხვას ვაანალიზებ");
    stick = true; toBottom(true);

    busy = true; syncSend();
    ctrl = new AbortController();
    const reveal = createReveal(ansEl);
    stopFn = () => { userStopped = true; ctrl.abort(); reveal.stop(); };

    const keep = finalText => {
      messages.push({ role: "assistant", content: finalText });
      bot._text = finalText;
      saveChat();
      addActions(bot, finalText);
    };

    // ერთი მცდელობა: ნაკადს ვკითხულობთ და სიტყვებს ანიმაციაში ვაწვდით
    async function run(withSearch, mi) {
      const opts = { stream: true, max_tokens: MAX_TOKENS, signal: ctrl.signal };
      const mdl = TIERS[tierIdx].models[mi];
      if (mdl) opts.model = mdl;
      if (withSearch) opts.tools = [{ type: "web_search" }];
      const history = [{ role: "system", content: systemPrompt() }]
        .concat(messages.slice(-HISTORY_LIMIT).map(m => ({ role: m.role, content: m.content })));
      // Puter-ის ნაკადი: for await ... of, ტექსტი type === "text" ნაწილებშია
      const stream = await puter.ai.chat(history, opts);
      for await (const part of stream) {
        if (userStopped) break;
        if (!part) continue;
        if (part.type === "text" && part.text) {
          if (!answer) finishThink();
          answer += part.text;
          reveal.push(part.text);
        } else if (part.type === "reasoning") {
          onReasoning(part.reasoning);
        } else if (/tool|server|search/.test(String(part.type))) {
          // ხელსაწყოს გამოძახება (ძებნა): თუ შეკითხვაც მოჰყვა, ვაჩვენებთ
          let raw = ""; try { raw = JSON.stringify(part).toLowerCase(); } catch (e) {}
          if (/search|web/.test(raw)) {
            let q = "";
            const cands = [part.input, part.block && part.block.input, part.block && part.block.action];
            for (const c of cands) if (c && typeof c.query === "string") { q = c.query; break; }
            q = q.replace(/\s+/g, " ").trim().slice(0, 70);
            step(q ? "ვეძებ ინტერნეტში: " + q : "ვეძებ ინტერნეტში");
          } else step("ინფორმაციას ვამუშავებ");
        } else if (part.type === "error") {
          const er = new Error(part.message || "error");
          er.code = part.code; er.status = part.status;
          throw er;
        }
      }
    }

    // სარეზერვო გზა: საკუთარი სერვერი (თუ Index.html სერვერთან ერთადაა გაშვებული)
    async function runServer() {
      let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
      const r = await fetch(API_URL, {
        method: "POST", signal: ctrl.signal, headers: { "content-type": "application/json" },
        body: JSON.stringify({ tz, messages: messages.slice(-HISTORY_LIMIT).map(m => ({ role: m.role, content: m.content })) })
      });
      if (!r.ok || !r.body) { const e = new Error("server"); e.status = r.status; e.fromServer = true; throw e; }
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      const line = ln => {
        if (!ln.startsWith("data:")) return;
        let j; try { j = JSON.parse(ln.slice(5).trim()); } catch (e) { return; }
        if (j.type === "content_block_delta" && j.delta && j.delta.text) {
          if (!answer) finishThink();
          answer += j.delta.text; reveal.push(j.delta.text);
        } else if (j.type === "error") {
          const e = new Error(String(j.message || "server")); e.fromServer = true; throw e;
        }
      };
      while (true) {
        const { value, done } = await rd.read();
        if (done || userStopped) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split(/\r?\n/); buf = lines.pop();
        lines.forEach(line);
      }
      line(buf);
    }

    // სურათი: ჯერ ქართულ აღწერას ინგლისურ დეტალურ პრომპტად ვაქცევთ, მერე ვხატავთ
    async function generateImage(skipPuter) {
      let prev = "";
      for (let i = messages.length - 2; i >= 0; i--) if (messages[i].imgPrompt) { prev = messages[i].imgPrompt; break; }
      const withPhotos = photos.length > 0;
      step(withPhotos ? "ვამუშავებ ფოტოს" : "ვამზადებ სურათის აღწერას");
      let en = text;
      const askMsgs = [{ role: "system", content: withPhotos ? IMG_SYS_EDIT : IMG_SYS },
        { role: "user", content: withPhotos ? "User request about the attached photo(s): " + text
          : (prev ? "Previous image prompt: " + prev + "\n\nUser request (may modify the previous image): " : "User request: ") + text }];
      for (const mdl of (skipPuter ? [] : [TIERS[0].models[0], null])) {
        try {
          const o = { stream: false, normalize: true, max_tokens: 350, signal: ctrl.signal };
          if (mdl) o.model = mdl;
          const r = await puter.ai.chat(askMsgs, o);
          let c = r && r.message && r.message.content;
          if (Array.isArray(c)) c = c.map(x => (x && x.text) || "").join("");
          if (typeof c === "string" && c.trim()) { en = c.trim().replace(/^["\u201C]|["\u201D]$/g, "").slice(0, 1200); break; }
        } catch (e) { if (userStopped || ctrl.signal.aborted) return null; }
      }
      if (userStopped) return null;
      step("ვხატავ სურათს");
      ansEl.innerHTML = '<div class="imgwait"></div>';
      toBottom();
      let ratio = pickRatio(text), img = null, mi = 0;
      const models = withPhotos ? IMG_EDIT_MODELS : IMG_MODELS;
      // სარეზერვო გზა სურათისთვის: საკუთარი სერვერი
      async function serverImage() {
        const r = await fetch("/api/image", {
          method: "POST", signal: ctrl.signal, headers: { "content-type": "application/json" },
          body: JSON.stringify({ prompt: en === text ? text : en, quality: TIERS[tierIdx].img, ratio, photos: withPhotos ? photos.map(p => p.full) : [] })
        });
        if (!r.ok) { const e = new Error("server"); e.status = r.status; e.fromServer = true; throw e; }
        const j = await r.json();
        if (!j || !j.image) { const e = new Error("server"); e.fromServer = true; throw e; }
        return { src: j.image };
      }
      const viaServerImg = async firstE => {
        step("ვცდი სხვა გზით");
        try { return await serverImage(); }
        catch (e2) {
          if (userStopped || ctrl.signal.aborted) return null;
          if (e2 && e2.fromServer && (e2.status === 501 || e2.status === 404)) throw firstE;   // სერვერზე სურათის გზა არ არის
          throw Object.assign(new Error("busy"), { code: "all_busy" });
        }
      };
      if (skipPuter) img = await viaServerImg(Object.assign(new Error("limit"), { code: "insufficient_funds", status: 402 }));
      for (let k = 0; k < 6 && !img && !userStopped; k++) {
        const o = { quality: TIERS[tierIdx].img };
        if (models[mi]) o.model = models[mi];
        if (withPhotos) { o.input_image = photos[0].full; o.input_images = photos.map(p => p.full); }
        if (ratio) o.ratio = ratio;
        try { img = await puter.ai.txt2img(en, o); }
        catch (e) {
          if (userStopped) return null;
          if (isLimitError(e)) { img = await viaServerImg(e); break; }
          const msg = String((e && e.message) || "").toLowerCase();
          if (ratio && /ratio|size|dimension|bad_request/.test(msg + String(e && e.code))) { ratio = null; continue; }
          if (mi < models.length && isModelProblem(e)) { mi++; step("ვცდი სხვა გზით"); continue; }
          throw e;
        }
      }
      if (userStopped) return null;
      if (!img || !img.src) throw new Error("სურათი ვერ მივიღე, სცადე თავიდან.");
      const src = await toBlobUrl(img.src);
      const probe = new Image();
      await new Promise(res => { probe.onload = probe.onerror = res; probe.src = src; });
      return { src, en, thumb: thumbOf(probe) };
    }

    try {
      const havePuter = typeof puter !== "undefined" && puter.ai;
      const noBalance = havePuter && await outOfBalance(imageMode ? Math.max(30000000, TIERS[tierIdx].need) : TIERS[tierIdx].need);
      const limitErr = () => Object.assign(new Error("limit"), { code: "insufficient_funds", status: 402 });
      let firstErr = noBalance ? limitErr() : null;
      let viaServer = !havePuter || noBalance;
      if (imageMode) {
        const out = await generateImage(noBalance || !havePuter);
        if (!out) { bot.remove(); messages.pop(); return; }
        finishThink();
        ansEl.innerHTML = "";
        const card = imageCard(out.src, text, true);
        if (photos.length) card._photos = photos;
        ansEl.appendChild(card);
        messages.push({ role: "assistant", content: "[დახატული სურათი: " + text + "]", image: out.thumb, imgPrompt: text, fromPhoto: photos.length > 0 });
        saveChat();
        return;
      }
      // ვცდით რიგით: თუ მოდელი ვერ მოიძებნა, შემდეგს; თუ ძებნა არ ჩაიარა, ძებნის გარეშე
      let search = WEB_SEARCH, mi = 0;
      for (let i = 0; i < 8 && !viaServer; i++) {
        try { await run(search, mi); break; }
        catch (e) {
          if (answer || userStopped || ctrl.signal.aborted) throw e;
          if (isLimitError(e)) { firstErr = e; viaServer = true; step("ვცდი სხვა გზით"); break; }
          if (mi < TIERS[tierIdx].models.length && isModelProblem(e)) { mi++; step("ვცდი სხვა გზით"); continue; }
          if (search && isSearchProblem(e)) { search = false; step("ვაგრძელებ ძებნის გარეშე"); continue; }
          throw e;
        }
      }
      if (viaServer && !answer && !userStopped) {
        if (!firstErr) step("ვცდი სხვა გზით");
        try { await runServer(); }
        catch (e2) {
          if (e2 && e2.fromServer && firstErr) {
            // სერვერი არ არის (404): პირველი შეცდომა; სერვერი არის, მაგრამ ყველა სერვისი დატვირთულია: ცალკე ტექსტი
            if (e2.status === 404) throw firstErr;
            throw Object.assign(new Error("busy"), { code: "all_busy" });
          }
          throw e2;
        }
      }
      if (viaServer && !answer && !userStopped && firstErr) throw Object.assign(new Error("busy"), { code: "all_busy" });
      if (!answer && !userStopped) throw new Error("პასუხი ვერ მივიღე, სცადე თავიდან.");
      await reveal.end();
      const finalText = userStopped ? reveal.shown() : answer;
      if (finalText) keep(finalText); else { bot.remove(); messages.pop(); }
    } catch (err) {
      const shown = reveal.stop();
      if ((err && err.name === "AbortError") || userStopped) {
        if (shown) keep(shown); else { bot.remove(); messages.pop(); }
      } else if (answer && shown) {
        keep(shown); // ნაკადი შუაში გაწყდა: უკვე დაწერილ ტექსტს ვინახავთ
      } else {
        const msg = err instanceof Error && !err.code && !err.status && err.message && /[Ⴀ-ჿ]/.test(err.message)
          ? err.message : puterError(err);
        bot._bubble.innerHTML = '<span class="err">' + esc(msg) + "</span>";
        messages.pop();
      }
    } finally {
      busy = false; ctrl = null; stopFn = null; syncSend(); toBottom();
      if (matchMedia("(hover: hover)").matches) inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", () => { if (busy && stopFn) stopFn(); else send(); });
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 190) + "px";
    syncSend();
  });
  syncSend();
  loadChats();
  renderRecents();
  redraw();
  if (matchMedia("(hover: hover)").matches) inputEl.focus();
})();
</script>
</body>
</html>
